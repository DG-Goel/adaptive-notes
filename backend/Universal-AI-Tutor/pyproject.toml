[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-tutor"
version = "0.1.0"
description = "A production-oriented, subject-independent AI tutoring platform with source-grounded RAG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD"}
authors = [
    {name = "Universal AI Tutor Team"}
]
keywords = ["ai", "tutor", "rag", "education", "llm", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Framework
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    
    # Vector Database - CRITICAL: Requires 1.20+ for native BM25
    "qdrant-client>=1.20.0,<1.21.0",
    
    # Orchestration
    "langgraph>=0.0.30,<1.0.0",
    "langchain-core>=0.1.0,<1.0.0",
    
    # Ingestion & Chunking
    "llama-index-core>=0.10.0,<1.0.0",
    
    # Embeddings & Reranking
    "sentence-transformers>=2.3.1,<3.0.0",
    "torch>=2.1.0,<3.0.0",
    
    # LLM Integration
    "groq>=0.5.0,<1.0.0",
    
    # Data Processing
    "python-multipart>=0.0.6",  # File uploads
    "charset-normalizer>=3.3.0",  # Encoding detection
    
    # Caching
    "cachetools>=5.3.0,<6.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",  # Async HTTP client
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    
    # Code Quality
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    
    # Type Stubs
    "types-cachetools",
    "types-requests",
]

evaluation = [
    # RAG Evaluation
    "ragas>=0.1.0",
    
    # Metrics
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/universal-ai-tutor"
Documentation = "https://github.com/yourusername/universal-ai-tutor/docs"
Repository = "https://github.com/yourusername/universal-ai-tutor"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests requiring external services",
    "evaluation: Evaluation tests for retrieval and generation quality",
    "slow: Tests that take significant time to run",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "llama_index.*",
    "qdrant_client.*",
    "groq.*",
    "sentence_transformers.*",
    "langgraph.*",
]
ignore_missing_imports = true
